[project]
name = "hiver-agent"
version = "0.1.0"
description = "AI support agent for @SpotifyCares built on the Customer Support on Twitter dataset"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
  "google-genai>=1.0",
  "anthropic>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "joblib>=1.3",
  "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
